<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f0eb">
  <title>影影的工作台</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏遮罩 -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- 左侧边栏抽屉 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-avatar">影</div>
        <div class="sidebar-user">
          <div class="sidebar-name">影影的工作台</div>
          <div class="sidebar-date" id="current-date">--</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="sidebar-item" data-page="settings">
          <span class="sidebar-icon">⚙️</span>
          <span class="sidebar-label">设置</span>
        </button>
      </div>
    </aside>

    <!-- 页面容器 -->
    <div class="page-container" id="page-container">

      <!-- 顶部栏 -->
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="15" y2="18"/>
          </svg>
        </button>
        <h2 class="topbar-title" id="topbar-title">影影的工作台</h2>
        <button class="icon-btn sync-btn" id="sync-btn" aria-label="同步">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/>
          </svg>
        </button>
      </header>

      <!-- 首页 -->
      <section class="page active" id="page-home">
        <div class="greeting-card">
          <div class="greeting-text">
            <p class="greeting-hello">今天也是创作的一天 ☁️</p>
            <h2 class="greeting-sub">影影，<br>先完成今日计划吧</h2>
          </div>
          <div class="progress-ring">
            <svg viewBox="0 0 36 36">
              <path class="progress-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path id="progress-circle" class="progress-ring-fill" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <span class="progress-text" id="progress-text">0%</span>
          </div>
        </div>
        <div class="home-shortcuts" id="home-shortcuts"></div>
      </section>

      <!-- 每日计划 -->
      <section class="page" id="page-daily">
        <div class="page-card">
          <div class="page-header">
            <span class="page-icon">☀️</span><h3>每日计划</h3>
          </div>
          <div class="task-list" id="daily-tasks"></div>
        </div>
      </section>

      <!-- 灵感抓取 -->
      <section class="page" id="page-inspo">
        <!-- 抖音链接粘贴入口 -->
        <div class="douyin-link-box" id="douyin-link-box">
          <div class="douyin-link-row">
            <input type="text" class="douyin-link-input" id="douyin-link-input"
              placeholder="粘贴抖音分享链接，自动提取灵感...">
            <button class="douyin-link-btn" id="douyin-link-btn">提取</button>
          </div>
          <p class="douyin-link-hint">在抖音点「分享」→「复制链接」，粘贴到此处</p>
          <div class="douyin-status" id="douyin-status" style="display:none;"></div>
        </div>

        <!-- 提取结果预览卡片 -->
        <div class="douyin-result-card" id="douyin-result-card" style="display:none;">
          <div class="douyin-result-header">
            <span class="douyin-result-type" id="douyin-result-type"></span>
            <span class="douyin-result-confidence" id="douyin-result-confidence"></span>
          </div>
          <p class="douyin-result-title" id="douyin-result-title"></p>
          <p class="douyin-result-summary" id="douyin-result-summary"></p>
          <div class="douyin-result-tags" id="douyin-result-tags"></div>
          <div class="douyin-result-actions">
            <button class="btn-primary" id="douyin-save-btn">保存到灵感库</button>
            <button class="btn-secondary" id="douyin-edit-btn">手动编辑</button>
            <button class="btn-secondary" id="douyin-cancel-btn">取消</button>
          </div>
        </div>

        <div class="filter-bar" id="inspo-filter"></div>
        <div class="inspo-list" id="inspo-list"></div>
      </section>

      <!-- 周周复盘 -->
      <section class="page" id="page-weekly">
        <div class="weekly-week-selector">
          <button id="week-prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="weekly-week-label" id="weekly-week-label">--</span>
          <button id="week-next">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div id="weekly-content"></div>
      </section>

      <!-- 备忘录 -->
      <section class="page" id="page-memo">
        <div class="memo-form">
          <textarea class="memo-input" id="memo-input" rows="2" placeholder="写一条备忘录..."></textarea>
          <button class="btn-primary" id="memo-add-btn">添加</button>
        </div>
        <div class="memo-list" id="memo-list"></div>
      </section>

      <!-- 英语学习 -->
      <section class="page" id="page-english">
        <div class="page-card">
          <div class="page-header"><span class="page-icon">🌿</span><h3>英语学习</h3></div>
          <div class="task-list" id="english-tasks"></div>
        </div>
      </section>

      <!-- 剪辑练习 -->
      <section class="page" id="page-edit">
        <div class="page-card">
          <div class="page-header"><span class="page-icon">🎬</span><h3>剪辑练习</h3></div>
          <div class="task-list" id="edit-tasks"></div>
        </div>
      </section>

      <!-- 修图练习 -->
      <section class="page" id="page-photo">
        <div class="page-card">
          <div class="page-header"><span class="page-icon">🖼️</span><h3>修图练习</h3></div>
          <div class="task-list" id="photo-tasks"></div>
        </div>
      </section>

      <!-- 添加页 -->
      <section class="page" id="page-add">
        <div class="add-tabs">
          <button class="add-tab active" data-tab="task">添加任务</button>
          <button class="add-tab" data-tab="inspiration">添加灵感</button>
        </div>
        <form class="add-form" id="add-form">
          <div class="form-group" id="board-select-group">
            <label>所属板块</label>
            <select class="form-select" id="entry-board"></select>
          </div>
          <div class="form-group">
            <label>标题</label>
            <input type="text" class="form-input" id="entry-title" placeholder="输入标题" required>
          </div>
          <div class="form-group">
            <label>备注 / 链接 / 详情</label>
            <textarea class="form-textarea" id="entry-desc" rows="4" placeholder="粘贴链接、复制文案或写下备注"></textarea>
          </div>
          <div class="form-group" id="date-group">
            <label>日期</label>
            <input type="date" class="form-input" id="entry-date">
          </div>
          <button type="submit" class="btn-primary">保存</button>
        </form>
      </section>

      <!-- 设置页 -->
      <section class="page" id="page-settings">
        <div class="settings-list">
          <div class="settings-card">
            <h3>📦 数据管理</h3>
            <p class="settings-desc">当前为本地存储模式。可导出 JSON 备份，也可导入恢复。</p>
            <button class="btn-secondary" id="export-btn">导出数据</button>
            <button class="btn-secondary" id="import-btn">导入数据</button>
            <input type="file" id="import-file" accept=".json" hidden>
          </div>
          <div class="settings-card">
            <h3>🔗 抖音灵感抓取</h3>
            <p class="settings-desc">在灵感页面粘贴抖音分享链接，系统会尝试提取视频信息并自动分类。如抓取失败，可以手动填写内容。</p>
          </div>
          <div class="settings-card">
            <h3>⚠️ 危险操作</h3>
            <button class="btn-danger" id="clear-btn">清空所有数据</button>
          </div>
        </div>
      </section>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-nav="daily">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>任务</span>
      </button>
      <button class="nav-item nav-add" data-nav="add">
        <div class="add-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
      </button>
      <button class="nav-item" data-nav="inspo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>灵感</span>
      </button>
      <button class="nav-item" data-nav="weekly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>复盘</span>
      </button>
    </nav>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
